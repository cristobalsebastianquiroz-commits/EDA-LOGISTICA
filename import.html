<script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const log = (msg) => { document.getElementById('log').textContent += '\n' + msg; };

// Parser de fechas tolerante — devuelve null si no se puede interpretar,
// en vez de dejar pasar una fecha inválida que hace fallar todo el import.
function excelSerialADate(n){
  // Excel cuenta los días desde 1899-12-30 (incluye el falso 29-feb-1900, pero no importa aquí)
  const epoch = Date.UTC(1899, 11, 30);
  const d = new Date(epoch + n * 86400000);
  return isNaN(d) ? null : d;
}
function parseFechaSegura(v){
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number') return excelSerialADate(v);
  const s = String(v).trim();
  if (!s) return null;
  // String puramente numérica (ej. "45959") = número de serie de Excel, NO un año
  if (/^\d{4,6}$/.test(s)) return excelSerialADate(Number(s));
  // ISO: 2024-12-30T00:00:00
  let d = new Date(s);
  if (!isNaN(d) && d.getUTCFullYear() >= 1990 && d.getUTCFullYear() <= 2100) return d;
  // DD/MM/AAAA o DD-MM-AAAA
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m){
    d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    if (!isNaN(d)) return d;
  }
  return null; // texto no reconocible (ej. un nombre metido por error en la columna)
}

async function importCollection(url, collection, mapDoc){
  const res = await fetch(url);
  const rows = await res.json();
  let batch = db.batch();
  let count = 0;
  for (const row of rows){
    const ref = db.collection(collection).doc();
    batch.set(ref, mapDoc(row));
    count++;
    if (count % 400 === 0){ await batch.commit(); batch = db.batch(); }
  }
  await batch.commit();
  log(`✔ ${collection}: ${count} documentos importados`);
}

document.getElementById('btnEquipos').onclick = () => importCollection('./equipos_maestro.json', 'equipos', e => ({

  certificado: e.certificado || '', maleta: e.maleta || '', accesorioDe: e.accesorioDe || null,
  ubicacionEspecial: e.ubicacionEspecial || null, proyectoActual: e.proyectoActual || null,
  responsableActual: e.responsableActual || null, notaEstado: e.notaEstado || '',
  creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
})).catch(err => log('✖ Error equipos: ' + err.message));

document.getElementById('btnMovs').onclick = () => importCollection('./movimientos.json', 'movimientos', m => ({

  fecha: parseFechaSegura(m.fecha),
  fechaEstimadaRetorno: parseFechaSegura(m.fechaEstimadaRetorno),
  creadoEn: firebase.firestore.FieldValue.serverTimestamp(),
})).catch(err => log('✖ Error movimientos: ' + err.message));

document.getElementById('btnEpp').onclick = () => importCollection('./epp_stock.json', 'epp_stock', it => ({
